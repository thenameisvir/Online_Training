spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1 # In-memory DB use karenge tests ke liye
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  cloud:
    config:
      enabled: false # Config server ko disable kiya
    discovery:
      enabled: false # Eureka discovery ko disable kiya

eureka:
  client:
    enabled: false # Eureka client ko disable kiya

